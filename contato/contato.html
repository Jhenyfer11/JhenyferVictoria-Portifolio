
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="contato.css">
</head>

<body>

    <header>

        <div class="container-grid menu">

            <img src="img/logo.png" alt="Logo da empresa Gamifica Ai">

            <nav id="menu" class="menu">
                <a href="../index.html#tecnologias">Tecnologias</a>
                <a href="../index.html#detalhes">Detalhes</a>
                <a href="contato.html">Contato</a>
            </nav>

            <button onclick="abreFechaMenu()">

                <svg id="icone-barras" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 448 512">
                    <path d="M0 96C0 78.3 14.3 64 32 64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 416c0-17.7-14.3-32-32-32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z"/>
                </svg>

                <svg id="icone-x" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 384 512">
                    <path d="M342.6 150.6c12.5-12.5 12.5-32.8-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/>
                </svg>

            </button>

        </div>

    </header>


    <!-- Sidebar -->
    <aside class="sidebar">

        <img src="img/logo.png" alt="Logo JV">

        <nav>
            <a href="../index.html#tecnologia">Tecnologias</a>
            <a href="../index.html#detalhes">Detalhes</a>
            <a href="contato.html">Contato</a>
        </nav>

    </aside>


    <!-- Contato -->
    <section class="contato container-grid" id="contato">

        <h2>Contato</h2>

        <form id="formulario-contato" class="formulario" method="post">

            <div class="grupo">

                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Seu nome"
                    required
                >

            </div>


            <div class="grupo">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Seu email"
                    required
                >

            </div>


            <div class="grupo">

                <label for="mensagem">Mensagem</label>

                <textarea
                    rows="5"
                    id="assunto"
                    name="assunto"
                    placeholder="Sua mensagem"
                    required
                ></textarea>

            </div>


            <button type="submit">Enviar</button>

            <p id="status-envio"></p>

        </form>

    </section>


    <!-- Biblioteca EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- JavaScript do projeto -->
    <script src="contato.js"></script>

</body>

</html>
